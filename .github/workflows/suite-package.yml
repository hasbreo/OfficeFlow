name: Package and verify OfficeFlow suite
on:
  push:
    branches: [main]
    paths: ['.github/workflows/suite-package.yml']
  workflow_run:
    workflows: ['Build Collabora native editors', 'Build Collabora native editors with checkpoints']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native source-build run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      OFFICEFLOW_CANDIDATE: ${{ github.workspace }}/officeflow-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Select the matching successful native build
        id: native
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id || inputs.native_run_id }}
        run: |
          $id=$env:NATIVE_RUN_ID
          if(-not $id){$id=gh api 'repos/hasbreo/OfficeFlow/actions/workflows/collabora-build.yml/runs?status=success&per_page=1' --jq '.workflow_runs[0].id'}
          if($id -notmatch '^\d+$'){throw 'No successful native source build was found'}
          $native=gh api "repos/hasbreo/OfficeFlow/actions/runs/$id" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $native.conclusion -ne 'success'){throw 'Native source build did not pass'}
          foreach($file in @('collabora/prepare.py','collabora/ci-build.sh')){
            $built=gh api "repos/hasbreo/OfficeFlow/contents/$($file)?ref=$($native.head_sha)" --jq '.sha'
            $current=git rev-parse "HEAD:$file"
            if($LASTEXITCODE -ne 0 -or $built -ne $current){throw "Native payload predates the current build recipe: $file"}
          }
          "id=$id" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore the matching built installer and source
        id: bundle
        uses: actions/cache/restore@v4
        with:
          key: officeflow-suite-v2-${{ steps.native.outputs.id }}-${{ hashFiles('integration/**', 'collabora/branding/**') }}
          path: ${{ env.OFFICEFLOW_CANDIDATE }}
      - uses: actions/download-artifact@v4
        if: steps.bundle.outputs.cache-hit != 'true'
        with:
          name: officeflow-native-development
          path: native-payload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.native.outputs.id }}
      - name: Install test client
        run: npm install --no-save --package-lock=false playwright@1.65.0 fflate@0.8.3
      - name: Verify source-built native editors
        if: steps.bundle.outputs.cache-hit != 'true'
        run: node ci/verify-native.cjs native-payload --rich
      - name: Obtain checksum-pinned shared source
        if: steps.bundle.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./integration/fetch-shared.ps1
      - name: Prepare and build shared installer
        if: steps.bundle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python integration/prepare-shared.py "$env:OFFICEFLOW_SHARED"
          Set-Location $env:OFFICEFLOW_SHARED
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'Dependency installation failed'}
          Set-Location $env:GITHUB_WORKSPACE
          node integration/build-suite.mjs "$env:OFFICEFLOW_SHARED" "$env:GITHUB_WORKSPACE/native-payload"
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
      - name: Retain the exact installer and corresponding source for validation retries
        if: steps.bundle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python integration/package-source.py "$env:OFFICEFLOW_SHARED"
          if($LASTEXITCODE -ne 0){throw 'Source packaging failed'}
          New-Item -ItemType Directory -Force $env:OFFICEFLOW_CANDIDATE | Out-Null
          Copy-Item "$env:OFFICEFLOW_SHARED/release-0.5/OfficeFlow-Setup-0.5.0.exe" $env:OFFICEFLOW_CANDIDATE
          Copy-Item "$env:RUNNER_TEMP/officeflow-shared/OfficeFlow-0.5.0-source.zip" $env:OFFICEFLOW_CANDIDATE
          $files=@('OfficeFlow-Setup-0.5.0.exe','OfficeFlow-0.5.0-source.zip') | ForEach-Object { @{name=$_;sha256=(Get-FileHash (Join-Path $env:OFFICEFLOW_CANDIDATE $_) -Algorithm SHA256).Hash.ToLowerInvariant()} }
          @{commit=(git rev-parse HEAD);nativeRun='${{ steps.native.outputs.id }}';files=@($files)} | ConvertTo-Json -Depth 5 | Set-Content "$env:OFFICEFLOW_CANDIDATE/build.json" -Encoding utf8NoBOM
      - name: Cache the built candidate before installation checks
        if: steps.bundle.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: officeflow-suite-v2-${{ steps.native.outputs.id }}-${{ hashFiles('integration/**', 'collabora/branding/**') }}
          path: ${{ env.OFFICEFLOW_CANDIDATE }}
      - name: Verify exact candidate bytes
        shell: pwsh
        run: |
          $build=Get-Content "$env:OFFICEFLOW_CANDIDATE/build.json" -Raw | ConvertFrom-Json
          if($build.nativeRun -ne '${{ steps.native.outputs.id }}'){throw 'Cached candidate uses another native source build'}
          foreach($file in $build.files){if((Get-FileHash (Join-Path $env:OFFICEFLOW_CANDIDATE $file.name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw 'Candidate checksum mismatch'}}
      - name: Test install over existing OfficeFlow
        shell: pwsh
        run: ./ci/verify-installer.ps1 -Installer "$env:OFFICEFLOW_CANDIDATE/OfficeFlow-Setup-0.5.0.exe"
      - name: Test app-specific start pages and new blank documents
        shell: pwsh
        run: node ci/verify-start-pages.cjs "$env:OFFICEFLOW_INSTALLED/collabora"
      - name: Test the installed native editors
        shell: pwsh
        run: node ci/verify-native.cjs "$env:OFFICEFLOW_INSTALLED/collabora" --expect-editable
      - name: Test installed MailFlow and PDFFlow
        shell: pwsh
        run: node ci/verify-shared.cjs "$env:OFFICEFLOW_INSTALLED"
      - name: Test uninstall and rollback retention
        shell: pwsh
        run: ./ci/verify-uninstall.ps1
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: officeflow-suite-test-evidence
          overwrite: true
          path: |
            probe-results/*.png
            probe-results/*.txt
            probe-results/*.pdf
          if-no-files-found: ignore
          retention-days: 7
      - name: Record verified release checksums
        shell: pwsh
        run: |
          $setup=Join-Path $env:OFFICEFLOW_CANDIDATE 'OfficeFlow-Setup-0.5.0.exe'
          $source=Join-Path $env:OFFICEFLOW_CANDIDATE 'OfficeFlow-0.5.0-source.zip'
          $sum=Join-Path $env:OFFICEFLOW_CANDIDATE 'SHA256SUMS.txt'
          @($setup,$source) | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+(Split-Path $_ -Leaf) } | Set-Content $sum -Encoding utf8NoBOM
      - name: Retain the verified installer and matching source
        uses: actions/upload-artifact@v4
        with:
          name: officeflow-verified-release
          overwrite: true
          path: ${{ env.OFFICEFLOW_CANDIDATE }}/
          compression-level: 0
          retention-days: 7
